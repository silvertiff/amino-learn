{% extends 'base.html' %}
{% block content %}
<div class="right-headers">
    <div class="table-header">Таблица</div>

    <table>
        <tr>
            <th>Название</th>
            <th>Строение</th>
            <th>Код</th>
        </tr>
        {% for card in cards %}
        <tr>
            <td>{{ card.name }}</td>
            <td>{{ card.structure }}</td>
            <td>{{ card.code }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="{% url 'card_list' %}">Назад</a>
    {% endblock %}
